; ESP32-C3 / ESP32-S3 GNSS NTP Time Server
; GNSS: Daxia Longque DX-GP22
; Display: SH1107/SSD1107 64x128 I2C OLED (portrait; UI rotated to 128x64)
; Input: KY-040 rotary encoder
; Targets share src/ 100%; pin differences live in include/config.h
; (#if defined(ARDUINO_ESP32S3_DEV)). S3 = DevKitC-1 + WROOM-1 N16R8.

[platformio]
default_envs = esp32-c3       ; bare `pio run` builds c3 only; s3 is opt-in via -e

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.partitions = default.csv
; Serial = UART0 (GPIO20/21, 板载 CH343). CDC=0 避免 Serial 被绑到原生 USB。
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.1
  adafruit/Adafruit SH110X @ ^2.1.12
  adafruit/Adafruit GFX Library @ ^1.11.11
  mikalhart/TinyGPSPlus @ ^1.1.0

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; WROOM-1 N16R8: 16MB QIO flash + 8MB OPI PSRAM (docs/esp32s3_devkitc1_hw.md)
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Serial = UART0 (GPIO43/44, 板载 USB-UART 桥) — 同 c3 语义, 烧录/监控走 UART 座
build_flags =
  ${env:esp32-c3.build_flags}
  -DBOARD_HAS_PSRAM
lib_deps = ${env:esp32-c3.lib_deps}
